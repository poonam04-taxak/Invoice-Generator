spring.application.name=invoice-generator

# MySQL connection
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/invoice_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:changeme}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent