<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Invoice ' + ${invoice.invoiceNumber}">Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .invoice-box { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 800px; margin: auto; }
        .badge-paid { background-color: #16a34a; }
        .badge-unpaid { background-color: #f59e0b; }
        .badge-overdue { background-color: #dc2626; }
        table th { background-color: #1e293b; color: #fff; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            .invoice-box { box-shadow: none; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark no-print" style="background-color:#1e293b;">
    <div class="container">
        <a href="/" class="navbar-brand"><i class="bi bi-receipt"></i> InvoicePro</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-arrow-left"></i> Back</a>
            <button onclick="window.print()" class="btn btn-warning btn-sm fw-semibold">
                <i class="bi bi-printer"></i> Print Invoice
            </button>
            <a th:href="@{/api/invoices/{id}/pdf(id=${invoice.id})}" class="btn btn-success btn-sm fw-semibold">
                <i class="bi bi-download"></i> Download PDF
            </a>

            <button th:if="${invoice.status.name() != 'PAID'}"
                    class="btn btn-outline-success btn-sm fw-semibold no-print"
                    th:data-invoice-id="${invoice.id}"
                    onclick="markAsPaid(this)">
                <i class="bi bi-check-circle"></i> Mark as Paid
            </button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="invoice-box">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h3 class="fw-bold mb-0">INVOICE</h3>
                <div class="text-muted" th:text="${invoice.invoiceNumber}"></div>
            </div>
            <div class="text-end">
                <span class="badge badge-paid" th:if="${invoice.status.name() == 'PAID'}">Paid</span>
                <span class="badge badge-unpaid" th:if="${invoice.status.name() == 'UNPAID'}">Unpaid</span>
                <span class="badge badge-overdue" th:if="${invoice.status.name() == 'OVERDUE'}">Overdue</span>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="text-muted small text-uppercase">Billed To</div>
                <div class="fw-semibold" th:text="${invoice.client.name}"></div>
                <div th:text="${invoice.client.address}"></div>
                <div th:text="${invoice.client.email}"></div>
                <div th:text="${invoice.client.phone}"></div>
            </div>
            <div class="col-md-6 text-md-end">
                <div><span class="text-muted">Invoice Date: </span><span th:text="${invoice.invoiceDate}"></span></div>
                <div><span class="text-muted">Due Date: </span><span th:text="${invoice.dueDate}"></span></div>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Description</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Unit Price</th>
                <th class="text-end">Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${invoice.items}">
                <td th:text="${item.description}"></td>
                <td class="text-end" th:text="${item.quantity}"></td>
                <td class="text-end">₹<span th:text="${item.unitPrice}"></span></td>
                <td class="text-end">₹<span th:text="${item.lineTotal}"></span></td>
            </tr>
            </tbody>
        </table>

        <div class="row">
            <div class="col-md-6"></div>
            <div class="col-md-6">
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Subtotal</span>
                    <span>₹<span th:text="${invoice.subtotal}"></span></span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Tax (<span th:text="${invoice.taxRate}"></span>%)</span>
                    <span>₹<span th:text="${invoice.taxAmount}"></span></span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Discount</span>
                    <span>- ₹<span th:text="${invoice.discount}"></span></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold">
                    <span>Grand Total</span>
                    <span>₹<span th:text="${invoice.grandTotal}"></span></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function markAsPaid(btn) {
        const invoiceId = btn.getAttribute('data-invoice-id');

        if (!confirm('Mark this invoice as Paid?')) return;

        try {
            const res = await fetch(`/api/invoices/${invoiceId}/status?status=PAID`, {
                method: 'PATCH'
            });

            if (!res.ok) {
                const text = await res.text();
                console.error('Update failed:', res.status, text);
                alert('Failed to update status: ' + res.status);
                return;
            }

            window.location.reload();
        } catch (err) {
            alert('Network error: ' + err.message);
        }
    }
</script>
</body>
</html>
